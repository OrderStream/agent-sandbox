name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Unit & Integration Tests
        run: |
          python -m unittest discover -s tests -v

      - name: Test CLI Lifecycle & Cryptographic Verification
        run: |
          agent-sandbox --version
          agent-sandbox init --output test-policy.yaml --force
          agent-sandbox inspect --policy test-policy.yaml "pytest tests/"
          agent-sandbox exec --policy test-policy.yaml --receipt receipt.json --sarif audit.sarif --summary -- python -c "print('CI verification success')"
          agent-sandbox verify receipt.json

  dogfood-action:
    name: Dogfood GitHub Action
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run agent-sandbox Action
        uses: ./
        with:
          command: "python -c \"print('Self-tested with agent-sandbox action!')\""
          summary: "true"
          receipt: "dogfood-receipt.json"
          sarif: "dogfood.sarif"

      - name: Verify Generated Cryptographic Receipt
        run: |
          python -m agent_sandbox.cli verify dogfood-receipt.json
